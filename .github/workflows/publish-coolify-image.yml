name: Publish Coolify Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-and-build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run go vet and tests
        run: |
          go vet ./...
          go test ./...

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/amd64 image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/joel299/gerador-contrato:coolify
            ghcr.io/joel299/gerador-contrato:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trigger-coolify-deploy:
    needs: test-and-build-image
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify Deploy Webhook
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
        run: |
          if [ -n "$COOLIFY_WEBHOOK" ]; then
            curl -fsS -X POST "$COOLIFY_WEBHOOK" \
              -H "Authorization: Bearer $COOLIFY_TOKEN" >/dev/null
          else
            echo "COOLIFY_DEPLOY_WEBHOOK not configured; skipping webhook trigger."
          fi
