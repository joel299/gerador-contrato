name: Publish Coolify Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-coolify-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # O teste de integracao gera PDF real via chromedp (headless). O runner nao
      # traz Chromium por padrao, por isso instalamos o Chrome for Testing e
      # exportamos o caminho via CHROME_PATH para o teste.
      - name: Setup Chrome for PDF integration test
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run go vet and tests
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          go vet ./...
          go test ./...

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/amd64 image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/joel299/gerador-contrato:coolify
            ghcr.io/joel299/gerador-contrato:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trigger-coolify-deploy:
    needs: test-and-build-image
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify Deploy Webhook
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ]; then
            echo "::error::COOLIFY_DEPLOY_WEBHOOK nao configurado nos secrets do repositorio. Deploy no Coolify nao disparado."
            exit 1
          fi

          auth_args=()
          if [ -n "$COOLIFY_TOKEN" ]; then
            auth_args=(-H "Authorization: Bearer $COOLIFY_TOKEN")
          else
            echo "::warning::COOLIFY_DEPLOY_TOKEN nao configurado; chamando o webhook sem header Authorization."
          fi

          status=$(curl -sS -o /tmp/coolify-response.txt -w "%{http_code}" -X POST "$COOLIFY_WEBHOOK" "${auth_args[@]}")
          echo "Coolify webhook HTTP status: $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Webhook do Coolify respondeu HTTP $status."
            exit 1
          fi
