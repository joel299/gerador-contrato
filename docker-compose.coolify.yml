services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    mem_limit: 256m
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - gerador_contrato_minio_data:/data
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-contratos}
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" && mc mb --ignore-existing local/$${S3_BUCKET:-contratos}
      "

  app:
    image: ghcr.io/joel299/gerador-contrato:coolify
    pull_policy: always
    restart: unless-stopped
    mem_limit: 768m
    depends_on:
      minio:
        condition: service_healthy
    expose:
      - "8080"
    volumes:
      - gerador_contrato_data:/app/data
    environment:
      PORT: "${PORT:-8080}"
      DB_PATH: "${DB_PATH:-/app/data/contracts.db}"
      LOCAL_PDF_DIR: "${LOCAL_PDF_DIR:-/app/data/pdfs}"
      TZ: "${TZ:-America/Campo_Grande}"
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-contratos}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_USE_PATH_STYLE: "true"
      DEFAULT_PAYMENT_LINK: ${DEFAULT_PAYMENT_LINK:-https://link.infinitepay.io/joel-quintana/VC1DLTAtUg-YfLpjLenlZ-1500,00}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  gerador_contrato_data:
  gerador_contrato_minio_data:
