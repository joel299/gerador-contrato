services:
  app:
    image: ghcr.io/joel299/gerador-contrato:coolify
    pull_policy: always
    restart: unless-stopped
    mem_limit: 768m
    expose:
      - "8080"
    volumes:
      - gerador_contrato_data:/app/data
    environment:
      PORT: "8080"
      DB_PATH: /app/data/contracts.db
      LOCAL_PDF_DIR: /app/data/pdfs
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      DEFAULT_PAYMENT_LINK: ${DEFAULT_PAYMENT_LINK:-https://link.infinitepay.io/joel-quintana/VC1DLTAtUg-YfLpjLenlZ-1500,00}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  gerador_contrato_data:
